<!doctype html>

<html>
  <head>
    <title>Lists</title>
  </head>
  <body>
    //--- unorder list ---//
    <ul>
      <li>foo</li>
      <li>bar</li>
      <li>baz</li>
    </ul>
    //--- order list---//
    <ol>
      <li>foo</li>
      <li>bar</li>
      <li>baz</li>
    </ol>
  </body>
</html>
